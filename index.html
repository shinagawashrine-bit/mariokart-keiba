<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マリカー競馬">
<title>マリカー競馬</title>
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shim.js"></script>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: motorsport broadcast. Light pit-lane concrete ground, white timing panels, carbon-black header slabs, racing red as the one loud color; TV board = starting-grid lanes + timing-tower odds; phone = cockpit with black bet bar. */
:root{
  color-scheme: light;
  --bg:#ecebe7;
  --paper:#ffffff;
  --paper2:#f4f4f1;
  --ink:#121216;
  --carbon:#18181d;
  --muted:#686873;
  --line:#d9d8d2;
  --red:#e10600;
  --redd:#a80400;
  --blue:#0b5cff;
  --green:#00a651;
  --yellow:#ffcc00;
  --gold:#ffcc00;
  --goldink:#e10600;
  --pink:#ff2d87;
  --up:#e10600;
  --down:#0b5cff;
  --rainbow:linear-gradient(90deg,var(--red) 0 25%,var(--ink) 25% 50%,var(--red) 50% 75%,var(--ink) 75%);
  --f-display:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Noto Sans JP","Arial Narrow",system-ui,sans-serif;
  --r:4px;
  --cut:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background-color:var(--bg);
  background-image:
    repeating-linear-gradient(-60deg,transparent 0 22px,#00000006 22px 24px),
    linear-gradient(180deg,#f7f7f5,var(--bg) 400px);
  color:var(--ink);font-family:var(--f-body);font-weight:700;
  padding-inline:16px;padding-block:0 24px;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:3px;padding:8px 10px;min-width:0}
h1,h2,h3{font-family:var(--f-display);font-weight:900;font-style:italic;margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-family:var(--f-num);font-weight:800;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{max-width:1500px;margin:0 auto}

.checker{height:12px;background:conic-gradient(var(--ink) 25%,#fff 0 50%,var(--ink) 0 75%,#fff 0) 0 0/12px 12px}
.rainbow{height:6px;background:repeating-linear-gradient(-60deg,var(--red) 0 18px,var(--ink) 18px 36px)}

/* logo */
.logo{display:flex;align-items:center;gap:0}
.logo .mark{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:clamp(24px,3vw,40px);line-height:1;color:#fff;background:var(--red);padding:8px 26px 8px 16px;clip-path:var(--cut);letter-spacing:.04em}
.logo .sub{font-family:var(--f-num);font-style:italic;font-weight:800;font-size:12px;letter-spacing:.35em;color:#fff;background:var(--ink);padding:3px 22px 3px 16px;clip-path:var(--cut);display:inline-block}
.logo>div:last-child{display:grid;gap:3px}
.flag{width:46px;align-self:stretch;min-height:44px;background:conic-gradient(var(--ink) 25%,#fff 0 50%,var(--ink) 0 75%,#fff 0) 0 0/11px 11px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);margin-right:-6px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 14px 4px 10px;font-weight:900;font-style:italic;font-size:13px;white-space:nowrap;background:var(--paper2);color:var(--ink);clip-path:var(--cut)}
.st-open{background:var(--green);color:#fff}
.st-countdown{background:var(--yellow);color:var(--ink)}
.st-closed{background:var(--red);color:#fff}
.st-done{background:var(--ink);color:#fff}
.st-wait{background:#dddcd6;color:var(--muted)}
.type-g1{background:linear-gradient(90deg,#d8a700,#ffd84a,#d8a700);color:var(--ink)}
.type-dobe{background:#5b4632;color:#fff}
.type-prelim{background:var(--ink);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

.c0{--lc:var(--red);--lt:#fde8e7} .c1{--lc:var(--blue);--lt:#e6eeff} .c2{--lc:var(--green);--lt:#e3f5ea} .c3{--lc:var(--yellow);--lt:#fff6d6}
.lanebadge{display:inline-grid;place-items:center;width:1.8em;height:1.45em;background:var(--lc);color:#fff;font-family:var(--f-num);font-weight:800;font-style:italic;font-size:1em;line-height:1;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.c3 .lanebadge,.lanebadge.c3{color:var(--ink)}

.kart{width:100%;height:auto;display:block;overflow:visible}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.1em;background:radial-gradient(circle at 35% 30%,#fff3b0 0 16%,#ffcc00 17% 62%,#c98f00 63%)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 22px 10px 16px;font-weight:900;font-style:italic;color:var(--ink);text-decoration:none;
  background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink);clip-path:var(--cut);transition:transform .08s,filter .08s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.go{background:var(--red);color:#fff;box-shadow:none}
.btn.red{background:var(--ink);color:#fff;box-shadow:none}
.btn.green{background:var(--green);color:#fff;box-shadow:none}
.btn.blue{background:var(--blue);color:#fff;box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;text-decoration:underline;clip-path:none;padding-inline:6px}
.btn.sm{padding:5px 16px 5px 10px;font-size:13px}
.btn[disabled]{opacity:.35;pointer-events:none}

.panel{background:var(--paper);border-radius:var(--r);box-shadow:0 1px 0 #0000000d,0 8px 24px -14px #0000004d;padding:16px;min-width:0;border-top:4px solid var(--ink)}
.panel h2{font-size:17px;display:flex;align-items:center;gap:10px;margin:-16px -16px 14px;padding:8px 16px;background:var(--carbon);color:#fff;flex-wrap:wrap}
.panel h2 .tag{font-family:var(--f-num);font-style:italic;font-weight:800;font-size:12px;letter-spacing:.2em;color:var(--red)}

.up{color:var(--up)!important}
.down{color:var(--down)!important}
.up::after{content:"▲";font-size:.4em;vertical-align:super;margin-left:2px}
.down::after{content:"▼";font-size:.4em;vertical-align:super;margin-left:2px}

/* ============ MODE PICKER ============ */
.picker{min-height:100%;display:grid;place-items:center;padding-block:40px}
.picker .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:min(1180px,100%);margin-top:34px}
@media (max-width:900px){.picker .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.picker .cards{grid-template-columns:1fr}}
.pick{text-align:left;padding:22px 22px 24px;background:var(--paper);display:grid;gap:8px;border-left:8px solid var(--lc);box-shadow:0 8px 24px -14px #00000066;transition:transform .12s}
.pick:hover{transform:translateX(4px)}
.pick b{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:26px}
.pick .k{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:14px;letter-spacing:.25em;color:var(--lc)}
.pick.c3 .k{color:#b08a00}

/* ============ BOARD ============ */
.board{display:grid;gap:14px;padding-block:14px}
.bhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.btitle{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btitle h1{font-size:clamp(28px,3.6vw,54px);line-height:1;letter-spacing:.02em}
.timer{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:clamp(36px,4.4vw,68px);line-height:1;padding:6px 30px 6px 20px;background:var(--carbon);color:var(--yellow);clip-path:var(--cut);font-variant-numeric:tabular-nums}
.timer.hot{color:#fff;background:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
.bmain{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:980px){.bmain{grid-template-columns:1fr}}
.lanes{display:grid;gap:8px}
.lane{position:relative;display:grid;grid-template-columns:auto minmax(80px,170px) minmax(0,1fr) auto;align-items:center;gap:16px;padding:8px 22px 8px 0;background:var(--paper);box-shadow:0 8px 24px -16px #00000066;overflow:hidden}
.lane::before{content:"";position:absolute;inset:0 auto 0 0;width:44%;background:linear-gradient(90deg,var(--lt),transparent);pointer-events:none}
.lane>*{position:relative}
.lane .gate{align-self:stretch;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-style:italic;font-size:clamp(40px,4.6vw,74px);width:1.5em;padding-right:.15em;background:var(--lc);color:#fff;clip-path:polygon(0 0,100% 0,78% 100%,0 100%)}
.lane.c3 .gate{color:var(--ink)}
.lane .who{min-width:0}
.lane .who .nm{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:clamp(22px,2.6vw,38px);line-height:1.1;overflow-wrap:anywhere}
.lane .who .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center}
.lane .share{height:6px;background:#e7e6e1;margin-top:10px;overflow:hidden;transform:skewX(-30deg)}
.lane .share i{display:block;height:100%;background:var(--lc);transition:width .6s}
.lane .odds{text-align:right}
.lane .odds .v{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:clamp(46px,5.6vw,92px);line-height:.9;font-variant-numeric:tabular-nums;display:inline-block}
.lane .odds .l{font-size:11px;color:var(--muted);letter-spacing:.2em;font-style:italic}
.ninki{display:inline-block;padding:2px 12px 2px 8px;font-weight:900;font-style:italic;font-size:12px;background:var(--paper2);color:var(--ink);clip-path:var(--cut)}
.ninki.n1{background:var(--red);color:#fff}
.est{opacity:.5;font-size:.42em;font-family:var(--f-body)}
.oddsgrid{display:grid;gap:14px}
.mx{width:100%;border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums}
.mx th{font-size:12px;color:var(--muted);font-weight:900}
.mx td{background:var(--paper2);text-align:center;padding:7px 2px;font-family:var(--f-num);font-weight:800;font-style:italic;font-size:clamp(17px,1.8vw,27px)}
.mx td.x{background:repeating-linear-gradient(-60deg,#e3e2dc 0 4px,transparent 4px 9px)}
.mx td.hot{background:#fff2c2;box-shadow:inset 0 -3px 0 var(--yellow)}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.olist.m-qu{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.olist.m-tri.n3{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.olist.m-qu .oitem,.olist.m-tri .oitem{padding:8px 14px 8px 10px}
.olist.m-qu .oitem .sel .lanebadge,.olist.m-tri .oitem .sel .lanebadge{font-size:17px}
.olist.m-qu .oitem .v,.olist.m-tri .oitem .v{font-size:clamp(24px,2.4vw,36px)}
.olist.n3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.oitem .v{white-space:nowrap}
.oitem{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--paper2);padding:6px 12px 6px 8px;border-left:3px solid var(--ink)}
.oitem .sel{display:flex;gap:3px;align-items:center;font-size:13px}
.oitem .sel .lanebadge{font-size:13px}
.oitem .v{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:clamp(18px,1.8vw,27px);display:inline-block}
.bfoot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:stretch}
@media (max-width:980px){.bfoot{grid-template-columns:1fr}}
.qr{display:flex;gap:16px;align-items:center;background:var(--carbon);color:#fff;border-top-color:var(--red)}
.qr .code{background:#fff;padding:8px;width:136px;height:136px;display:grid;place-items:center;flex:none}
.qr .code img,.qr .code canvas{width:118px!important;height:118px!important}
.qr .txt b{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:24px;display:block}
.qr .txt .muted{color:#b9b9c2}
.sales{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.sales div{background:var(--paper2);padding:6px 10px;border-left:3px solid var(--red)}
.sales small{display:block;font-size:11px;color:var(--muted)}
.sales .num{font-size:30px;line-height:1.1}
.stand{display:grid;gap:3px;font-size:14px}
.stand .row{display:grid;grid-template-columns:2em minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 10px;background:var(--paper2)}
.stand .row .num{font-size:20px}
.stand .row.g1{box-shadow:inset 4px 0 0 var(--yellow)}
.stand .row.dobe{box-shadow:inset 4px 0 0 #8a6a4b}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:repeating-linear-gradient(-60deg,#e10600f2 0 46px,#c40500f2 46px 92px);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.overlay .inner{width:min(1300px,100%);display:grid;gap:18px}
.overlay .sub2{text-align:center;margin:0;font-size:18px;background:var(--carbon);color:#fff;padding:6px 26px 6px 18px;justify-self:center;clip-path:var(--cut);font-style:italic}
.stamp{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:clamp(48px,8.5vw,132px);line-height:1;text-align:center;color:#fff;text-shadow:6px 6px 0 var(--ink);letter-spacing:.02em;animation:slam .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes slam{from{transform:translateX(-30%) skewX(-20deg);opacity:0}to{transform:none;opacity:1}}
.bigcount{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:min(46vw,420px);line-height:1;color:#fff;text-shadow:14px 14px 0 var(--red);animation:slam .3s cubic-bezier(.2,1.5,.4,1)}
.poprow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.popc{background:var(--paper);border-top:6px solid var(--lc);padding:8px 14px 10px;display:grid;gap:2px;box-shadow:0 10px 30px -14px #000a;animation:pop .4s backwards}
.popc .pk{font-weight:900;font-style:italic;font-size:15px;color:var(--muted)}
.popc:first-child .pk{color:var(--red)}
.popc .pn{display:flex;align-items:center;gap:8px;font-size:22px;min-width:0}
.popc .pn b{font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:.25em;min-width:0}
.popc .po{text-align:right;font-weight:800;font-style:italic}
.popc .po .num{font-family:var(--f-num);font-size:44px;line-height:1}
@media (max-width:700px){.poprow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.tcard{background:var(--paper);padding:0 14px 10px;animation:pop .4s backwards;box-shadow:0 10px 30px -14px #000a}
@keyframes pop{from{transform:translateX(-24px);opacity:0}}
.tcard h3{font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 -14px 6px;padding:8px 14px;background:var(--carbon);color:#fff}
.tline{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.tline:first-of-type{border-top:0}
.tline .num{font-size:20px}
.badge{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:12px;padding:3px 12px 3px 8px;letter-spacing:.06em;clip-path:var(--cut)}
.b-max{background:var(--yellow);color:var(--ink)}
.b-ana{background:var(--red);color:#fff}
.b-one{background:var(--blue);color:#fff}
.b-hit{background:var(--green);color:#fff}
.podium{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:700px){.podium{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pod{text-align:center;display:grid;gap:6px;justify-items:center;color:#fff}
.pod .rk{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:clamp(34px,3.6vw,60px);line-height:1;text-shadow:4px 4px 0 var(--ink)}
.pod .rk.r1{color:var(--yellow)} .pod .rk.r2{color:#fff} .pod .rk.r3{color:#ffb489} .pod .rk.r4{color:#ffd0cd}
.pod .k{width:min(200px,100%);background:#fff;padding:6px 18px 4px 10px;clip-path:var(--cut)}
.pod .nm{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:clamp(20px,2.2vw,32px);text-shadow:3px 3px 0 var(--ink)}
.pod .block{width:100%;background:var(--carbon);background-image:repeating-linear-gradient(-60deg,transparent 0 14px,#ffffff08 14px 28px)}
.paytable{width:100%;border-collapse:collapse;font-size:16px}
.paytable td,.paytable th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.paytable th{color:var(--muted);font-weight:900;font-size:14px}
.paytable .num{font-size:30px;text-align:right}
.hitlist{display:flex;flex-wrap:wrap;gap:6px}
.hit{background:var(--paper2);border-left:4px solid var(--green);padding:6px 12px;font-weight:900}
.hit .num{color:var(--red);font-size:24px}
.pod .hit{color:var(--ink)}
.pod .block{display:flex;align-items:center;justify-content:center}
.bprize{display:flex;align-items:center;gap:6px;color:var(--yellow);font-family:var(--f-display);font-weight:900;font-style:italic;font-size:clamp(16px,1.8vw,26px);text-shadow:2px 2px 0 var(--ink)}
.bprize .num{font-family:var(--f-num);font-size:clamp(22px,2.6vw,40px)}
.bprize .bpl{font-size:.7em;color:#fff}

/* ============ BET (phone) ============ */
.bet{max-width:560px;margin:0 auto;display:grid;gap:10px;padding-block:14px 170px}
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--carbon);color:#fff;border-left:6px solid var(--red)}
.me .muted{color:#a9a9b3}
.me .btn.ghost{color:#fff}
.me .nm{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:22px}
.me .bal{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:36px;display:flex;align-items:center;gap:8px;color:var(--yellow)}
.rbanner{padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 8px 24px -16px #00000066}
.rbanner h2{font-size:24px}
.rbanner .t{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:36px;background:var(--carbon);color:var(--yellow);padding:0 20px 0 12px;clip-path:var(--cut)}
.rbanner .t.hot{background:var(--red);color:#fff;animation:pulse .5s infinite alternate}
.rcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rcard{padding:0 10px 8px;background:var(--paper);display:grid;gap:2px;text-align:left;position:relative;min-width:0;box-shadow:0 8px 24px -16px #00000066;border-top:5px solid var(--lc);transition:transform .1s}
.rcard .top{display:flex;align-items:center;gap:6px;min-width:0;padding-top:8px}
.rcard .nm{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:.25em;min-width:0}
.rcard .o{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:34px;line-height:1;text-align:right}
.rcard .kwrap{width:78%;margin:0 auto}
.rcard.sel{background:var(--lc);color:#fff;transform:translateY(-2px)}
.rcard.sel .muted{color:#fff}
.rcard.c3.sel{color:var(--ink)}

/* ===== G1: gold, flashy ===== */

/* ===== D1: dark, gloomy ===== */
body[data-race="dobe"]{--bg:#0d0d11;--paper:#1a1a21;--paper2:#24242c;--ink:#e2e2ea;--muted:#8a8a98;--line:#34343e;--carbon:#060608;--red:#a3121f;--goldink:#ff5a68;color-scheme:dark;
  background-color:#0d0d11;background-image:radial-gradient(ellipse at 50% -10%,#3a1424aa,transparent 55%),repeating-linear-gradient(-60deg,transparent 0 22px,#ffffff05 22px 24px),linear-gradient(180deg,#121218,#0b0b0e)}

.ov-dobe{background:radial-gradient(ellipse at 50% 30%,#2b0f19f7,#050507fa 70%)}

<script>
/* ---------------- constants ---------------- */
const BASE_URL = window.MK_WEB ? location.origin+location.pathname : "https://claude.ai/artifact/Ug3DgvUgKsvgAscixb5he2";
const BET_URL = BASE_URL+"#bet";
const MK = {
  win:{label:"単勝", n:1, ordered:true, help:"1着を当てる"},
  ex:{label:"連単", n:2, ordered:true, help:"1着→2着を順番どおり"},
  qu:{label:"連複", n:2, ordered:false, help:"1・2着を順不同"},
  tri:{label:"3連複", n:3, ordered:false, help:"上位3人を順不同（＝D当て）"},
  t3:{label:"3連単", n:3, ordered:true, help:"1→2→3着を順番どおり", finals:true},
};
const MORDER = ["win","ex","qu","tri","t3"];
const DEFAULT_SETTINGS = {
  rates:{win:80, ex:75, qu:75, tri:75, t3:70},
  seed:{ex:500, qu:500, tri:500, t3:500},
  caps:{win:0, ex:1000, qu:1000, tri:1000, t3:500, self:1000},
  countdown:60,
  prizes:{prelim:[10,5], g1:[15,10], dobe:[5]},
  virtual:300,
  unit:100,
  yen:1,
  chipV:2,
};
const POINTS = [4,3,2,1];
const TYPE_LABEL = {prelim:"予選", g1:"G1 グランプリ", dobe:"D決定戦"};
const STATUS_LABEL = {wait:"待機", open:"受付中", countdown:"締切まもなく", closed:"締切", done:"確定"};
const CIRC = ["①","②","③","④"];

/* ---------------- state ---------------- */
const S = {
  db:null, user:null, uid:null, isOwner:false, ready:false, noDb:false,
  state:null, ledger:null, bets:{}, roster:null, history:null, ps:{},
  ui:{ m:"win", sel:[], amt:100, order:[], form:{}, proxyMember:"", pm:"win", psel:[], pamt:100, confirm:null, perPerson:null, claimOpen:false },
  prevOdds:{}, flash:{}, closing:false, lastOverlayKey:"",
};
function defaultState(){ return {members:[], races:[], cur:-1, settings:clone(DEFAULT_SETTINGS), gameId:rid()}; }
/* exRid：そのレース自身の結果を除いて計算する（確定後も締切時と同じ倍率を出すため） */
function settings(exRid){
  let s=(S.state&&S.state.settings)||{};
  // 1枚＝10円・10枚単位のころに保存した設定は、1枚＝1円・100枚単位に合わせて10倍にして読む
  if(!s.chipV && Object.keys(s).length){
    s=clone(s); const x10=o=>{ if(o) for(const k in o) if(typeof o[k]==="number") o[k]*=10; };
    x10(s.seed); x10(s.caps); ["virtual","unit"].forEach(k=>{ if(typeof s[k]==="number") s[k]*=10; }); s.yen=1; s.chipV=2;
  }
  const st=deepMerge(clone(DEFAULT_SETTINGS), s);
  const L=learnedTune(st, exRid);
  ["ex","qu","tri","t3"].forEach(m=>{ if(L.seed[m]!=null) st.seed[m]=L.seed[m]; });
  if(L.virtual!=null) st.virtual=L.virtual;
  if(L.caps) Object.assign(st.caps, L.caps);
  { const U=st.unit||1, ten=Math.floor((L.given||0)*0.1/U)*U, cap=Math.max(Math.round(1000/U)*U, ten, U); ["ex","qu","tri","t3","self"].forEach(m=>st.caps[m]=cap); } // 単勝以外と走者の自分単勝：1000枚か、配ったチップの10%の多いほう
  if(L.countdown!=null) st.countdown=L.countdown;
  st.learned=L.from;
  return st;
}
/* 自動調整：払戻率と賞金％以外は、遊んだ記録から決める。
   - 見せ金（連系）：直近10レースの売上の中央値の2倍を買い目の数で割る（少なすぎると数枚で倍率が暴落するため）。
   - 仮の票（単勝）：直近10レースの単勝の売上の中央値の半分を4人で割る。どちらも3レース分たまるまでは初期値。
   - 締切カウントダウン：直近5レースで「＋30秒」が押された回数と「即締切」の割合から、30〜120秒で調整。 */
let tuneCache={};
function learnedTune(st, exRid){
  const hr=(S.history&&S.history.races)||[], le=(S.ledger&&S.ledger.entries)||[];
  const key=[hr.length, hr.length?hr[hr.length-1].rid+hr[hr.length-1].t:"", le.length, le.length?le[le.length-1].t:"", S.state&&S.state.gameId, st.unit, exRid||""].join("|");
  if(tuneCache[key]) return tuneCache[key];
  if(Object.keys(tuneCache).length>20) tuneCache={};
  return tuneCache[key]=learnedTuneCalc(st, exRid);
}
function learnedTuneCalc(st, exRid){
  const U=Math.max(1,st.unit||1), rU=x=>Math.max(U,Math.round(x/U)*U), cl=(x,a,b)=>Math.min(b,Math.max(a,x));
  const med=a=>{ const b=a.slice().sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; };
  const H=((S.history&&S.history.races)||[]).filter(x=>x.rid!==exRid).slice().sort((a,b)=>a.t-b.t), out={seed:{}, from:{}};
  const P=H.filter(x=>x.pools), NC={ex:12, qu:6, tri:4, t3:24};
  ["ex","qu","tri","t3"].forEach(m=>{ const xs=P.filter(x=>x.pools[m]!=null).slice(-10).map(x=>x.pools[m]);
    if(xs.length>=3){ out.seed[m]=cl(rU(med(xs)*2/NC[m]), U*2, U*20); out.from.seed=xs.length; } });
  const ws=P.filter(x=>x.pools.win!=null).slice(-10).map(x=>x.pools.win);
  if(ws.length>=3){ out.virtual=cl(Math.round(med(ws)*0.5/4/10)*10, U, U*10); out.from.virtual=ws.length; }
  const gid=S.state&&S.state.gameId, given={};
  ((S.ledger&&S.ledger.entries)||[]).filter(e=>e.gameId===gid&&e.amt>0).forEach(e=>given[e.member]=(given[e.member]||0)+e.amt);
  const gv=Object.values(given);
  if(gv.length){ out.given=med(gv); }
  const C=H.filter(x=>x.ext!=null).slice(-5);
  if(C.length>=3){ const ext=C.reduce((a,x)=>a+x.ext,0)/C.length, early=C.filter(x=>x.early).length/C.length;
    out.countdown=cl(Math.round((60+15*ext-15*early)/5)*5, 30, 120); out.from.countdown=C.length; }
  return out;
}

/* ---------------- utils ---------------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }
function rid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fl(x){ return Math.floor(x*10+1e-9)/10; }
function fmtO(v){ return v>=100 ? Math.floor(v).toString() : v.toFixed(1); }
function now(){ return Date.now(); }
function members(){ return (S.state&&S.state.members)||[]; }
function active(){ return members().filter(m=>!m.left); }
/* レースに出る人：離脱しておらず「出走×」でもない人 */
function racers(){ return active().filter(m=>!m.noRace); }
function mem(id){ return members().find(m=>m.id===id); }
function mname(id){ return (mem(id)||{}).name || "?"; }
function races(){ return (S.state&&S.state.races)||[]; }
function curRace(){ const r=races(); return S.state && S.state.cur>=0 ? r[S.state.cur] : null; }
function raceTitle(r){ return r.type==="prelim" ? `第${r.no}R 予選` : TYPE_LABEL[r.type]+((r.round||1)>1?`（第${r.round}大会）`:""); }
/* 1日に何回も大会（予選→決勝）を行う。今の大会のレースだけ */
function curRound(){ return (S.state&&S.state.round)||1; }
function roundRaces(){ return races().filter(r=>(r.round||1)===curRound()); }
function laneIdx(r,id){ return r.runners.indexOf(id); }
function roster(){ return (S.roster&&S.roster.players)||[]; }
function pname(id){ const m=mem(id); if(m) return m.name; const p=roster().find(x=>x.id===id); return p?p.name:"?"; }
function pstats(gid, exRid){
  const st={}, get=id=>st[id]||(st[id]={id,runs:0,ranks:[0,0,0,0],g1:0,d1:0,pl:0,recent:[]});
  ((S.history&&S.history.races)||[]).filter(x=>(!gid||x.gid===gid)&&(!exRid||x.rid!==exRid)).slice().sort((a,b)=>a.t-b.t).forEach(x=>{
    x.order.forEach((id,i)=>{ const s=get(id); s.runs++; s.ranks[i]++; s.recent.push(i+1); if(x.type==="g1"&&i===0) s.g1++; if(x.type==="dobe"&&i===x.order.length-1) s.d1++; });
    for(const [id,v] of Object.entries(x.pl||{})) get(id).pl+=v;
  });
  return st;
}
function pct(a,b){ return b? Math.round(a/b*100) : 0; }
function recentHtml(s,n){ return `<span class="fms">${s.recent.slice(-n).map(x=>`<span class="fm f${x}">${x}</span>`).join("")}</span>`; }
function formHtml(id){
  const s=S.ps[id]; if(!s||!s.runs) return `<div class="form"><b>初出走</b></div>`;
  return `<div class="form"><span>通算 <b>${s.runs}戦${s.ranks[0]}勝</b></span><span>勝率 <b>${pct(s.ranks[0],s.runs)}%</b></span><span>前走 <b>${s.recent[s.recent.length-1]}着</b></span>${recentHtml(s,5)}${s.g1?`<span class="ninki n1">G1×${s.g1}</span>`:""}</div>`;
}
function streak(id){
  let n=0; races().filter(r=>r.settle&&r.settle.order.includes(id)).forEach(r=>{ n = r.settle.order[0]===id ? n+1 : 0; }); return n;
}
function fire(id){ const n=streak(id); return n>=2 ? `<span class="fire">🔥${n}連勝中</span>` : ""; }
/* AI予想：通算の着順ポイント（少ない出走は平均に寄せる）＋直近3走の調子で順位を付け、◎○▲ */
function aiMarks(r){
  const ps=pstats(null, r.id), tb=id=>(mem(id)||{}).tb||0, sc={};
  r.runners.forEach(id=>{ const s=ps[id]; let pts=0,n=0; if(s) s.ranks.forEach((c,i)=>{ pts+=c*(4-i); n+=c; });
    const base=(pts+2.5*3)/(n+3), rec=s?s.recent.slice(-3):[], recent=(rec.reduce((a,x)=>a+(5-x),0)+2.5)/(rec.length+1);
    sc[id]=base+0.5*(recent-2.5)+tb(id)*1e-3; });
  const o=r.runners.slice().sort((a,b)=>sc[b]-sc[a]), runs=r.runners.reduce((a,id)=>a+((ps[id]||{}).runs||0),0);
  const mk={}; mk[o[0]]="◎"; mk[o[1]]="○"; mk[o[2]]="▲";
  return {h:o[0], t:o[1], a:o[2], mk, thin:runs<4};
}
function aiTag(r,id){ const m=aiMarks(r).mk[id]; return m?`<span class="ninki ai">AI${m}</span>`:""; }
function marksAgg(r){
  const agg={}; r.runners.forEach(id=>agg[id]={h:0,t:0,a:0,pts:0});
  Object.values(S.bets).forEach(d=>{ const mk=d.marks&&d.marks[r.id]; if(!mk||!d.member||r.runners.includes(d.member)) return;
    [["h",3],["t",2],["a",1]].forEach(([k,p])=>{ const id=mk[k]; if(agg[id]){ agg[id][k]++; agg[id].pts+=p; } }); });
  let top=null; r.runners.forEach(id=>{ if(agg[id].pts && (!top||agg[id].pts>agg[top].pts)) top=id; });
  return {agg, top};
}
function awards(){
  const gid=S.state.gameId, bal=balances(), given={};
  ((S.ledger&&S.ledger.entries)||[]).filter(e=>e.gameId===gid).forEach(e=>given[e.member]=(given[e.member]||0)+e.amt);
  const net=members().map(m=>({id:m.id, v:(bal[m.id]||0)-(given[m.id]||0)})).sort((a,b)=>b.v-a.v);
  const hits={}, pays={}; let ana=null;
  races().forEach(r=>{ if(!r.settle) return; raceTickets(r).forEach(t=>{ const p=ticketPay(r,t); if(!p) return;
    hits[t.member]=(hits[t.member]||0)+1; pays[t.member]=(pays[t.member]||0)+p;
    const v=r.settle.winOdds[t.m].v; if(!ana||v>ana.v||(v===ana.v&&p>ana.pay)) ana={id:t.member, v, m:t.m, pay:p, r, sel:t.sel}; }); });
  const hk=Object.keys(hits).sort((a,b)=>hits[b]-hits[a]||pays[b]-pays[a]);
  const g1s=races().filter(r=>r.type==="g1"&&r.settle).map(r=>({id:r.settle.order[0], r}));
  return { mvp:net[0]||null, hit:hk[0]?{id:hk[0], n:hits[hk[0]], pay:pays[hk[0]]}:null, ana, g1s };
}
function dayOver(){ return !!(S.state&&S.state.ended); }
function finalRows(){
  const gid=S.state.gameId, bal=balances(), given={};
  ((S.ledger&&S.ledger.entries)||[]).filter(e=>e.gameId===gid).forEach(e=>given[e.member]=(given[e.member]||0)+e.amt);
  return members().map(m=>({id:m.id, given:given[m.id]||0, bal:bal[m.id]||0, net:(bal[m.id]||0)-(given[m.id]||0)})).sort((a,b)=>b.net-a.net||b.bal-a.bal);
}
function finalCard(me){
  if(!dayOver()) return "";
  const rows=finalRows(), i=rows.findIndex(x=>x.id===me), x=rows[i]; if(!x) return "";
  return `<div class="final"><div class="ft">本日の最終ポイント</div><div class="fv"><span class="num">${x.bal}</span>枚</div>
    <div class="fs"><span>配られた ${x.given}枚</span><b class="${x.net>0?"plus":x.net<0?"minus":""}">${x.net>0?"+":""}${x.net}</b><span>${i+1}位 / ${rows.length}人</span></div></div>`;
}
function adminFinal(){

function marketsFor(r){ return MORDER.filter(m=>!MK[m].finals || r.type!=="prelim"); }

function combs(arr,k){ if(k===0) return [[]]; if(arr.length<k) return []; const [h,...t]=arr; return [...combs(t,k-1).map(c=>[h,...c]), ...combs(t,k)]; }

/* ---------------- tickets / money ---------------- */
function allTickets(){
  const out=[];

function validFor(r,t){
  if(!r || t.race!==r.id || r.status==="wait") return false;
  if(r.closeAt && t.t > r.closeAt + 1500) return false;
  if(r.runners.includes(t.member) && !(t.m==="win" && t.sel[0]===t.member)) return false;
  return true;
}
function raceTickets(r){ return r ? allTickets().filter(t=>validFor(r,t)) : []; }
function balances(){
  const b={}; members().forEach(m=>b[m.id]=0);
  ((S.ledger&&S.ledger.entries)||[]).forEach(e=>{ if(e.gameId===S.state.gameId && b[e.member]!==undefined) b[e.member]+=e.amt; });
  const byId={}; races().forEach(r=>byId[r.id]=r);
  allTickets().forEach(t=>{ const r=byId[t.race]; if(r && validFor(r,t) && b[t.member]!==undefined) b[t.member]-=t.amt; });
  races().forEach(r=>{ if(r.settle){ for(const [m,a] of Object.entries(r.settle.payouts||{})) if(b[m]!==undefined) b[m]+=a; for(const [m,a] of Object.entries(r.settle.prizes||{})) if(b[m]!==undefined) b[m]+=a; } });

}

/* ---------------- odds engine ---------------- */
/* 仮の票の配り方：通算の着順ポイント（1着4〜4着1点）が高い人ほど多く。
   出走が少ない人は平均（2.5点）に寄せ、初出走は平均扱い。仮の票の合計は変えない。 */
function formWeights(R, exRid){
  const ps=exRid&&((S.history&&S.history.races)||[]).some(x=>x.rid===exRid) ? pstats(null, exRid) : (S.ps||pstats()), K=3, w={};
  R.forEach(id=>{ const s=ps[id]; let pts=0, n=0;
    if(s) s.ranks.forEach((c,i)=>{ pts+=c*(4-i); n+=c; });
    w[id]=Math.exp((pts+2.5*K)/(n+K)-2.5); });
  const sum=R.reduce((a,id)=>a+w[id],0);
  R.forEach(id=>w[id]=w[id]*R.length/sum);
  return w;
}
function computeOdds(r, tix){
  const st=settings(r.id), R=r.runners, ms=marketsFor(r), pools={};
  ms.forEach(m=>pools[m]={total:0, by:{}});
  tix.forEach(t=>{ if(!pools[t.m]) return; const k=keyOf(t.m,t.sel); pools[t.m].total+=t.amt; pools[t.m].by[k]=(pools[t.m].by[k]||0)+t.amt; });
  const v=st.virtual, W=pools.win.total, p={}, fw=formWeights(R, r.id);
  R.forEach(id=>p[id]=((pools.win.by[id]||0)+v*fw[id])/(W+R.length*v));
  const odds={win:{}};
  R.forEach(id=>{ const b=pools.win.by[id]||0; const rate=st.rates.win/100;
    odds.win[id] = b>0 ? {v:Math.max(1,fl(W*rate/b)), sel:[id], pop:b} : {v:Math.max(1,fl(rate/p[id])), sel:[id], pop:0, est:true}; });
  ms.filter(m=>m!=="win").forEach(m=>{
    const n=MK[m].n, list = MK[m].ordered ? perms(R,n) : combs(R,n);
    const seedTotal=(st.seed[m]||0)*list.length, P=pools[m].total+seedTotal, rate=st.rates[m]/100;
    odds[m]={};
    list.forEach(sel=>{
      const k=keyOf(m,sel);
      const pr = MK[m].ordered ? harv(p,sel) : perms(sel,n).reduce((a,s)=>a+harv(p,s),0);
      const b=pools[m].by[k]||0, sd=seedTotal*pr;
      odds[m][k] = (b+sd)>0 ? {v:Math.max(1,fl(P*rate/(b+sd))), sel, pop:b} : {v:0, sel, pop:b, est:true};
    });
  });
  return {pools, odds, p};
}
function popularity(r,O){
  const arr=r.runners.map(id=>({id, v:O.odds.win[id].v}));
  arr.sort((a,b)=>a.v-b.v); const rank={}; arr.forEach((x,i)=>rank[x.id]=i+1); return rank;
}
function trackFlash(O, rid){
  // レースが変わったら前回値を捨てる（前のレースの倍率と比べて色が付かないように）
  if(S.flashRace!==rid){ S.flashRace=rid; S.prevOdds={}; S.flash={}; }
  const t=now();
  for(const m in O.odds) for(const k in O.odds[m]){
    const key=m+":"+k, v=O.odds[m][k].v, prev=S.prevOdds[key];
    if(prev!==undefined && prev!==v) S.flash[key]={dir:v>prev?"up":"down", until:t+1800};
    S.prevOdds[key]=v;
  }
}
function fc(m,k){ const f=S.flash[m+":"+k]; return f && f.until>now() ? f.dir : ""; }

/* 払い戻しと賞金は1件ごとに10枚単位へ切り捨て（1の位を出さない） */
function payRound(x){ return Math.floor(x/10+1e-9)*10; }
function settleRace(r){
  const tix=raceTickets(r), O=computeOdds(r,tix), o=r.order, st=settings();
  const win={win:o[0], ex:keyOf("ex",[o[0],o[1]]), qu:keyOf("qu",[o[0],o[1]]), tri:keyOf("tri",[o[0],o[1],o[2]]), t3:keyOf("t3",[o[0],o[1],o[2]])};
  const hits=[], payouts={}, winOdds={};
  marketsFor(r).forEach(m=>{ const e=O.odds[m][win[m]]; const real=(O.pools[m].by[win[m]]||0)>0; winOdds[m]={key:win[m], sel:e?e.sel:[], v: real&&e ? e.v : null}; });
  tix.forEach(t=>{
    if(keyOf(t.m,t.sel)!==win[t.m]) return;
    const v=winOdds[t.m].v; if(!v) return;
    const pay=payRound(t.amt*v);
    hits.push({member:t.member, m:t.m, sel:t.sel, amt:t.amt, v, pay});
    payouts[t.member]=(payouts[t.member]||0)+pay;
  });
  const sales=tix.reduce((a,t)=>a+t.amt,0);
  const prizes={}; (st.prizes[r.type]||[]).forEach((pct,i)=>{ if(!pct||!o[i]||!sales) return; prizes[o[i]]=(prizes[o[i]]||0)+Math.max(10,payRound(sales*pct/100)); });
  const paid=Object.values(payouts).reduce((a,b)=>a+b,0), prz=Object.values(prizes).reduce((a,b)=>a+b,0);
  const poolTotals={}; for(const m in O.pools) poolTotals[m]=O.pools[m].total;
  return {order:o.slice(), sales, poolTotals, winOdds, hits, payouts, prizes, house:sales-paid-prz, at:now()};
}

/* ---------------- standings & schedule ---------------- */
function standings(){
  const s={}; racers().forEach(m=>s[m.id]={id:m.id, pts:0, ranks:[0,0,0,0], runs:0});
  roundRaces().filter(r=>r.type==="prelim"&&r.settle).forEach(r=>r.settle.order.forEach((id,i)=>{ if(s[id]){ s[id].pts+=POINTS[i]; s[id].ranks[i]++; s[id].runs++; } }));
  const tb=id=>(mem(id)||{}).tb||0;
  Object.values(s).forEach(x=>x.avg=x.runs?x.pts/x.runs:0);
  return Object.values(s).sort((a,b)=> b.avg-a.avg || b.pts-a.pts || b.ranks[0]-a.ranks[0] || b.ranks[1]-a.ranks[1] || b.ranks[2]-a.ranks[2] || tb(b.id)-tb(a.id));
}
function finalsOn(){ const f=(S.state&&S.state.finals)||{}; return {g1:f.g1!==false, dobe:f.dobe!==false}; }
/* rebuild the remaining waiting qualifier races after someone joins or leaves:
   fewest total runs go first, avoid back-to-back, spread pairings, nudge extras to mid-tier players */
function rescheduleRest(s){
  const ids=s.members.filter(m=>!m.left&&!m.noRace).map(m=>m.id);
  const rest=s.races.map((r,i)=>({r,i})).filter(x=>x.i>s.cur && x.r.type==="prelim" && x.r.status==="wait");
  if(!rest.length || ids.length<4) return false;
  const base={}; ids.forEach(i=>base[i]=0);
  s.races.forEach((r,i)=>{ if(r.type==="prelim" && !(i>s.cur && r.status==="wait")) r.runners.forEach(id=>{ if(base[id]!==undefined) base[id]++; }); });
  const cur=s.races[s.cur], last0=cur&&cur.type==="prelim"?cur.runners:[];
  const ps=pstats(), mid=id=>{ const x=ps[id]; return x&&x.runs ? Math.abs(x.ranks.reduce((a,c,k)=>a+c*(k+1),0)/x.runs-2.35) : .15; };
  let best=null, bestScore=Infinity;
  for(let a=0;a<300;a++){
    const c=Object.assign({},base), pair={}; let last=last0, out=[], score=0;
    for(let k=0;k<rest.length;k++){
      const ch=[];
      for(let q=0;q<4;q++){
        const cand=ids.filter(i=>!ch.includes(i));
        const cost=i=> c[i]*100 + (last.includes(i)?30:0) + ch.reduce((t,o)=>t+(pair[[i,o].sort().join()]||0)*3,0) + mid(i)*8 + Math.random()*3;
        cand.sort((x,y)=>cost(x)-cost(y)); ch.push(cand[0]);
      }
      ch.forEach(i=>{ c[i]++; if(last.includes(i)) score+=10; });
      for(let x=0;x<4;x++) for(let y=x+1;y<4;y++){ const kk=[ch[x],ch[y]].sort().join(); pair[kk]=(pair[kk]||0)+1; }
      last=ch; out.push(ch.sort(()=>Math.random()-.5));
    }
    const v=Object.values(c), mean=v.reduce((x,y)=>x+y,0)/v.length;
    score+=v.reduce((t,x)=>t+(x-mean)*(x-mean),0)*100 + Object.values(pair).reduce((t,x)=>t+x*x,0);
    if(score<bestScore){ best=out; bestScore=score; }
  }
  rest.forEach((x,k)=>{ x.r.runners=best[k]; });
  return true;
}
function raceCountOptions(n){ const o=[]; for(let R=3;R<=14;R++){ if(4*R<n) continue; o.push({R, base:Math.floor(4*R/n), extra:(4*R)%n}); } return o; }
/* extra runs go to players whose all-time average finish is around the middle (slightly upper side);
   the strongest will race the G1 anyway and the weakest shouldn't be dragged into more races */
function scheduleTargets(ids, R){
  const n=ids.length, base=Math.floor(4*R/n), extra=(4*R)%n, ps=pstats();
  const avg=id=>{ const s=ps[id]; return s&&s.runs ? s.ranks.reduce((a,c,k)=>a+c*(k+1),0)/s.runs : 2.5; };
  const tb=id=>(mem(id)||{}).tb||0;
  const order=ids.slice().sort((a,b)=> Math.abs(avg(a)-2.35)-Math.abs(avg(b)-2.35) || tb(a)-tb(b));
  const extras=order.slice(0,extra), tgt={};
  ids.forEach(i=>tgt[i]=base+(extras.includes(i)?1:0));
  return {tgt, extras, base};
}
function makeSchedule(ids, tgt){
  const R=ids.reduce((a,i)=>a+tgt[i],0)/4; let best=null, bestScore=Infinity;
  for(let a=0;a<600;a++){
    const cnt={}, pair={}; ids.forEach(i=>cnt[i]=0); let last=[], out=[], score=0, ok=true;
    for(let r=0;r<R;r++){
      const chosen=[];
      for(let s=0;s<4;s++){
        const cand=ids.filter(i=>cnt[i]<tgt[i] && !chosen.includes(i));
        if(!cand.length){ ok=false; break; }
        const maxRem=Math.max(...cand.map(i=>tgt[i]-cnt[i]));
        const cost=i=> (maxRem-(tgt[i]-cnt[i]))*100 + (last.includes(i)?10:0) + chosen.reduce((a,c)=>a+(pair[[i,c].sort().join()]||0)*3,0) + Math.random()*2;
        cand.sort((x,y)=>cost(x)-cost(y)); chosen.push(cand[0]);
      }
      if(!ok) break;
      chosen.forEach(i=>{ cnt[i]++; if(last.includes(i)) score+=10; });
      for(let x=0;x<4;x++) for(let y=x+1;y<4;y++){ const kk=[chosen[x],chosen[y]].sort().join(); pair[kk]=(pair[kk]||0)+1; }
      last=chosen; out.push(chosen.sort(()=>Math.random()-.5));
    }
    if(!ok) continue;
    score+=Object.values(pair).reduce((a,v)=>a+v*v,0);
    if(score<bestScore){ best=out; bestScore=score; }
  }
  return best;
}

}

function tone(f,t0,dur,type,vol,slide){
  const c=audio(); if(!c) return; const t=c.currentTime+t0, o=c.createOscillator(), g=c.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.linearRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.12,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const NT=n=>440*Math.pow(2,(n-69)/12);
const SOUNDS={
  coin(){ tone(NT(83),0,.07,"square",.1); tone(NT(88),.07,.28,"square",.1); },
  tick(){ tone(NT(81),0,.1,"sine",.22); },
  tickHi(){ tone(NT(88),0,.2,"sine",.26); },
  horn(){ tone(NT(45),0,.9,"sawtooth",.12); tone(NT(52),0,.9,"sawtooth",.1); tone(NT(57),0,.9,"square",.05); },
  reveal(){ [72,76,79,84].forEach((n,i)=>tone(NT(n),i*.07,.14,"square",.08)); },
  fanfare(){ [[67,0,.12],[72,.12,.12],[76,.24,.12],[79,.36,.3],[76,.7,.12],[79,.82,.7]].forEach(([n,t,d])=>tone(NT(n),t,d,"triangle",.2)); [60,64,67].forEach(n=>tone(NT(n),.82,.7,"square",.04)); },
  g1(){ [[67,0,.15],[67,.15,.15],[67,.3,.15],[72,.45,.6],[70,1.05,.15],[72,1.2,.15],[74,1.35,.15],[76,1.5,1]].forEach(([n,t,d])=>{ tone(NT(n),t,d,"sawtooth",.08); tone(NT(n+12),t,d,"triangle",.07); });
    [60,64,67,72].forEach(n=>tone(NT(n),1.5,1.1,"square",.035)); for(let i=0;i<10;i++) tone(NT(84+[0,4,7,12][i%4]),2.5+i*.06,.1,"square",.045); },
  sad(){ [[55,0,.45],[54,.5,.45],[53,1,.45],[52,1.5,1.3]].forEach(([n,t,d])=>tone(NT(n),t,d,"sawtooth",.12,NT(n)*.97)); },
  dark(){ tone(NT(36),0,2.4,"sawtooth",.1); tone(NT(37),0,2.4,"sawtooth",.07); tone(NT(48),.4,1.8,"triangle",.06); tone(NT(43),1.6,1.4,"sawtooth",.06,NT(40)); },
  jackpot(){ for(let i=0;i<12;i++) tone(NT(76+[0,4,7,12][i%4]+(i>=4?12:0)),i*.055,.12,"square",.08); [72,76,79,84].forEach(n=>tone(NT(n),.75,.9,"triangle",.11)); },
};

/* watch race transitions for sounds and phone celebrations */
const W={rid:null,st:null,rem:null,ready:false};
function seen(k){ try{ return localStorage.getItem(k)==="1"; }catch(e){ return !!S["_"+k]; } }
function markSeen(k){ try{ localStorage.setItem(k,"1"); }catch(e){ S["_"+k]=true; } }
/* 締切の瞬間にスマホへ「締切！あなたの馬券」ポップ */
function phoneClosePop(r){
  const me=myMember(); if(!me||seen("close:"+r.id)) return;
  markSeen("close:"+r.id);
  S.cel={rid:r.id, kind:"close"};
  clearTimeout(phoneCelebrate._t); phoneCelebrate._t=setTimeout(()=>{ if(S.cel&&S.cel.kind==="close"){ S.cel=null; render(); } },9000);
  render();
}
function phoneCelebrate(r){
  const me=myMember(); if(!me||!r.settle||seen("cel:"+r.id)) return;
  markSeen("cel:"+r.id);
  const s=r.settle, pay=s.hits.filter(x=>x.member===me).reduce((a,x)=>a+x.pay,0), prize=s.prizes[me]||0;
  if(pay+prize>0){ const champ=r.type==="g1"&&s.order[0]===me; S.cel={rid:r.id, kind:"win", pay, prize, title: champ?"GRAND PRIX WINNER":pay?"YOU WIN":"PRIZE", head: champ?"G1優勝！":pay?"的中！":"賞金ゲット！"}; play("jackpot"); }
  else { const lost=raceTickets(r).filter(t=>t.member===me).reduce((a,t)=>a+t.amt,0); if(!lost) return; S.cel={rid:r.id, kind:"lose", lost}; play("sad"); }
  clearTimeout(phoneCelebrate._t); phoneCelebrate._t=setTimeout(()=>{ S.cel=null; render(); },8000);
  render();
}
function sfxWatch(){
  const md=mode(); if(md!=="board"&&md!=="bet") return;
  const r=curRace(); if(!r) return;
  const rem=remain(r), st = r.status==="countdown"&&rem===0 ? "closed" : r.status;
  if(!W.ready || r.id!==W.rid){
    const fresh=W.ready; W.ready=true; W.rid=r.id; W.st=st; W.rem=rem;
    if(fresh && md==="board" && r.type!=="prelim" && st==="open") play(r.type==="g1"?"g1":"dark");
    if(md==="bet" && st==="done") phoneCelebrate(r);
    return;
  }
  if(st==="countdown" && rem!==W.rem && rem>0 && rem<=(md==="board"?10:5)) play(rem<=3?"tickHi":"tick");
  if(md==="board" && S.state.ceremony && W.cer!==S.state.ceremony){ W.cer=S.state.ceremony; play("g1"); }
  if(st!==W.st){
    if(st==="closed"){ play(md==="board"?"horn":"tickHi"); if(md==="board") setTimeout(()=>play("reveal"),900); else phoneClosePop(r); }
    if(st==="done"){ if(md==="board") play(r.type==="g1"?"g1":r.type==="dobe"?"sad":"fanfare"); else phoneCelebrate(r); }
  }
  W.st=st; W.rem=rem;
}

function mode(){ const h=(location.hash||"").replace("#",""); return ["admin","board","bet","stats","help","adminhelp"].includes(h)?h:""; }
function render(){
  const app=document.getElementById("app");
  const ae=document.activeElement, aid=ae&&ae.id, selS=ae&&ae.selectionStart;
  let html="";
  const md=mode();
  if(S.ready&&S.state) S.ps=pstats();
  if(!md) html=renderPicker();
  else if(md==="help") html=renderHelp();
  else if(S.noDb) html=renderNoDb();
  else if(!S.ready) html=`<div class="picker"><div>${logo()}<p class="muted" style="text-align:center">読み込み中…</p></div></div>`;
  else if(md==="board") html=renderBoard();
  else if(md==="bet") html=renderBet();
  else if(md==="stats") html=renderStats();
  else if(md==="adminhelp") html=renderAdminHelp();
  else html=renderAdmin();
  app.innerHTML=html;
  if(md==="admin"){ const seen={}; document.querySelectorAll("#app .admin .panel > h2").forEach(h=>{ const t=(h.childNodes[0]&&h.childNodes[0].textContent||"").trim(); if(!t) return; seen[t]=(seen[t]||0)+1; const k=seen[t]>1?t+seen[t]:t;
    h.dataset.act="foldPanel"; h.dataset.k=k; h.classList.add("foldh"); h.setAttribute("role","button"); h.tabIndex=0;
    if((S.ui.foldH||{})[k]) h.parentElement.classList.add("folded"); }); }
  const cr=S.ready&&S.state&&!S.noDb?curRace():null;
  document.body.dataset.race = (md==="board"||md==="bet")&&cr ? cr.type : "";
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus(); try{ if(selS!=null) el.setSelectionRange(selS,selS); }catch(e){} } }
  renderOverlay();
  if(md==="board"){ drawQR(); fitBoard(); }
}

function renderBoard(){
  const r=curRace();
  if(!r) return `<div class="board wrap"><div class="checker"></div><div class="bhead">${logo()}</div>
    <div class="panel" style="text-align:center;padding:60px 16px"><h1 style="font-size:40px">まもなくスタート</h1><p class="muted">管理画面でメンバーを登録して、出走表を作ってください</p></div>${boardQR()}</div>`;
  const tix=raceTickets(r), O=computeOdds(r,tix); trackFlash(O, r.id);
  const rank=popularity(r,O), W=O.pools.win.total, rem=remain(r), MA=marksAgg(r);
  const lanes=r.runners.map((id,i)=>{
    const o=O.odds.win[id], share=W? Math.round((O.pools.win.by[id]||0)/W*100):0;
    const res = r.settle ? r.settle.order.indexOf(id)+1 : 0;
    return `<div class="lane c${i}">
      <div class="gate"><span>${i+1}<small>P</small></span></div>
      <div>${kart(i,i+1)}</div>
      <div class="who"><div class="nm">${esc(mname(id))}</div>
        <div class="meta"><span class="ninki ${rank[id]===1?"n1":""}">${rank[id]}番人気</span><span>単勝票 <b class="num">${O.pools.win.by[id]||0}</b> 枚</span>${res?`<span class="ninki n1">${res}着</span>`:""}${fire(id)}${MA.agg[id].pts?`<span class="mks">◎${MA.agg[id].h} ○${MA.agg[id].t} ▲${MA.agg[id].a}</span>`:""}${MA.top===id?`<span class="ninki honmei">みんなの本命</span>`:""}${aiTag(r,id)}</div>
        ${formHtml(id)}
        <div class="share"><i style="width:${share}%"></i></div></div>
      <div class="odds"><div class="l">単勝</div><div class="v ${fc("win",id)}">${o.est?`<span class="est">参考</span> `:""}${fmtO(o.v)}</div></div>
    </div>`;
  }).join("");
  const ms=marketsFor(r);
  const exM = `<div class="panel"><h2>連単 <span class="tag">EXACTA · 1着↓ 2着→</span></h2><div class="scroll"><table class="mx"><tr><th></th>${r.runners.map((id,j)=>`<th>${badge(r,id)}</th>`).join("")}</tr>
    ${r.runners.map(a=>`<tr><th>${badge(r,a)}</th>${r.runners.map(b=>{ if(a===b) return `<td class="x"></td>`; const k=keyOf("ex",[a,b]), e=O.odds.ex[k]; return `<td class="${fc("ex",k)} ${e.pop?"hot":""}">${fmtO(e.v)}</td>`; }).join("")}</tr>`).join("")}</table></div></div>`;

/* 大画面はスクロールなしで1画面に収める：はみ出す分だけ全体を縮小（iPad 11インチ・外部モニター想定） */
function fitBoard(){
  if(mode()!=="board") return;
  const shrink=(el, over)=>{ if(!el) return; el.style.zoom=""; let z=1;
    for(let k=0;k<4;k++){ const o=over(); if(o<=1) break; z=Math.max(.35, z/o*0.98); el.style.zoom=z; } };
  const b=document.querySelector("#app .board");
  shrink(b, ()=>document.documentElement.scrollHeight/window.innerHeight);
  const ov=document.querySelector("#ov .overlay"), inner=ov&&ov.querySelector(".inner");
  if(inner) shrink(inner, ()=>{ const cs=getComputedStyle(ov), avail=ov.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom); return inner.getBoundingClientRect().height/avail; });
}
window.addEventListener("resize",()=>fitBoard());
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fitBoard());
/* overlays on board: countdown last 5s, reveal (closed), result (done) */
function renderOverlay(){
  const ov=document.getElementById("ov");
  if(mode()==="bet"){ const cer=S.state&&S.state.ended&&S.ui.cerClosed!==S.state.ended&&myMember();
    const k=cer?"pcer"+S.state.ended+":"+allTickets().length:(S.cel?"cel"+S.cel.rid+S.cel.kind:""); if(k!==S.lastOverlayKey){ ov.innerHTML=cer?phoneCerHtml():celHtml(); S.lastOverlayKey=k; } return; }
  if(mode()!=="board"){ ov.innerHTML=""; S.lastOverlayKey=""; return; }
  const r=curRace(); if(!r){ ov.innerHTML=""; return; }
  const rem=remain(r);
  let key="", html="";
  const closed = r.status==="closed" || (r.status==="countdown" && rem===0);
  if(S.introSeen!==r.id){ S.introSeen=r.id; if(r.type!=="prelim" && r.status==="open") S.intro={id:r.id, until:now()+7000}; }
  if(S.state.ceremony){ key="cer"+S.state.ceremony+":"+allTickets().length+":"+((S.ledger&&S.ledger.entries)||[]).length; html=ceremonyHtml(); }
  else if(r.status==="countdown" && rem>0 && rem<=5){ key="cd"+r.id+rem; html=`<div class="overlay" style="background:#18181d8c"><div class="bigcount">${rem}</div></div>`; }
  else if(closed){ key="rv"+r.id+raceTickets(r).length; html=revealHtml(r); }
  else if(r.status==="done" && r.settle){ key="rs"+r.id+r.settle.at; html=resultHtml(r); }
  else if(S.intro && S.intro.id===r.id && now()<S.intro.until && isLive(r)){ key="in"+r.id; html=introHtml(r); }
  if(key!==S.lastOverlayKey){ ov.innerHTML=html; S.lastOverlayKey=key; fitBoard(); }
}
function confetti(n){
  const cols=["#ffd84a","#fff","#e10600","#18181d","#ffb000","#fff6c9"]; let s="";
  for(let i=0;i<n;i++){ const l=(i*37.7)%100, d=((i*1.37)%5).toFixed(2), du=(3+(i%7)*0.5).toFixed(2), w=6+(i%4)*3;
    s+=`<i class="cf" style="left:${l.toFixed(1)}%;width:${w}px;background:${cols[i%cols.length]};animation-delay:-${d}s;animation-duration:${du}s"></i>`; }
  return `<div class="confetti">${s}</div>`;
}
function introHtml(r){
  const st=standings(), rank={}; st.forEach((x,i)=>rank[x.id]=i+1);
  const cards=r.runners.map((id,i)=>`<div class="ic c${i}" style="animation-delay:${.3+i*.15}s"><span class="lanebadge c${i}">${i+1}P</span><div class="k">${kart(i,i+1)}</div><div class="nm">${esc(mname(id))}</div><div class="rk">予選${rank[id]||"-"}位</div></div>`).join("");
  if(r.type==="g1") return `<div class="overlay ov-g1">${confetti(70)}<div class="inner"><div class="gp-top">FINAL ROUND</div><div class="stamp g1stamp">GRAND PRIX</div><p class="sub2">G1 グランプリ ・ 予選上位4人の頂上決戦</p><div class="introgrid">${cards}</div></div></div>`;
  return `<div class="overlay ov-dobe"><div class="inner"><div class="gp-top">LAST PLACE BATTLE</div><div class="stamp dobestamp">D1</div><p class="sub2">D決定戦 ・ 4着が真のD</p><div class="introgrid">${cards}</div></div></div>`;
}
function revealHtml(r){
  const tix=raceTickets(r), O=computeOdds(r,tix), by={};
  tix.forEach(t=>(by[t.member]=by[t.member]||[]).push(t));
  const totals=Object.entries(by).map(([m,ts])=>[m,ts.reduce((a,t)=>a+t.amt,0)]);
  const maxM = totals.length ? totals.sort((a,b)=>b[1]-a[1])[0][0] : null;
  let anaM=null, anaV=0; tix.forEach(t=>{ const e=O.odds[t.m][keyOf(t.m,t.sel)]; if(e && e.v>anaV){ anaV=e.v; anaM=t.member; } });
  const cards=Object.entries(by).map(([m,ts],i)=>{
    const bs=[]; if(m===maxM) bs.push(`<span class="badge b-max">MAX BET</span>`); if(m===anaM && anaV>=10) bs.push(`<span class="badge b-ana">大穴狙い</span>`); if(ts.length===1) bs.push(`<span class="badge b-one">一点勝負</span>`); if(r.runners.includes(m)) bs.push(`<span class="badge b-self">自分に賭けた</span>`);
    return `<div class="tcard" style="animation-delay:${i*.12}s"><h3><span>${esc(mname(m))}</span><span class="row">${bs.join("")}</span></h3>
      ${ts.map(t=>{ const e=O.odds[t.m][keyOf(t.m,t.sel)]; return `<div class="tline"><span class="row" style="gap:6px"><b>${MK[t.m].label}</b>${selHtml(r,t.m,t.sel,true)}</span><span><b class="num">${t.amt}</b>枚 <span class="muted num">${e?fmtO(e.v):""}倍</span></span></div>`; }).join("")}</div>`;
  }).join("");
  return `<div class="overlay ov-${r.type}">${r.type==="g1"?confetti(30):""}<div class="inner"><div class="stamp">締切！馬券公開</div>
    <p class="sub2">${esc(raceTitle(r))}　合計 <b class="num" style="color:var(--goldink)">${tix.reduce((a,t)=>a+t.amt,0)}</b> 枚</p>

/* スマホ：連単・連複などを選んだとき、全部の組み合わせの倍率を一覧に（押すとその組み合わせを選ぶ） */
function phoneOddsList(r,O,m,sel){

function ticketPay(r,t){ const w=r.settle&&r.settle.winOdds[t.m]; return w&&w.v&&keyOf(t.m,t.sel)===w.key ? payRound(t.amt*w.v) : 0; }
function betRecord(member){
  const rows=[]; let stake=0, pay=0, hits=0;
  races().forEach(r=>{ if(!r.settle) return; raceTickets(r).filter(t=>t.member===member).forEach(t=>{ const p=ticketPay(r,t); rows.push({r,t,p}); stake+=t.amt; pay+=p; if(p) hits++; }); });
  return {rows, stake, pay, hits, n:rows.length, net:pay-stake, roi: stake? Math.round(pay/stake*100) : 0};
}
function betTable(){
  const rows=members().map(m=>({m, ...betRecord(m.id)})).filter(x=>x.n).sort((a,b)=>b.net-a.net);

/* スマホの成績表：自分のデータだけ。今の成績 → 今日のレース → 通算（日付を押すとその日のレース） */
function myRaceRows(me, gid){
  const H=((S.history&&S.history.races)||[]).filter(x=>x.gid===gid).slice().sort((a,b)=>a.t-b.t);

/* ---------------- actions ---------------- */
function toast(msg){ const t=document.getElementById("toast"); t.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML="",2200); }
const A={
  claim(d){ const id=d.id; S.ui.claimOpen=false; mutateBets(S.uid, b=>{ b.member=id; b.tickets=b.tickets||[]; }); },
  sound(){ SFX.on=!SFX.on; try{ localStorage.setItem("mk_sound",SFX.on?"1":"0"); }catch(e){} if(SFX.on){ audio(); play("coin"); } render(); },
  celClose(){ S.cel=null; render(); },
  pickCombo(d){ const r=curRace(); if(!r) return; const e=computeOdds(r,raceTickets(r)).odds[d.m][d.k]; if(!e) return; S.ui.m=d.m; S.ui.sel=e.sel.slice(); render(); },
  fullscreen(){ const d=document, el=d.documentElement;
    if(fsEl()){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
    const f=el.requestFullscreen||el.webkitRequestFullscreen; if(f){ try{ const p=f.call(el); if(p&&p.catch) p.catch(()=>toast("全画面にできませんでした")); }catch(e){ toast("全画面にできませんでした"); } } },
  foldPanel(d){ const f=S.ui.foldH=S.ui.foldH||{}; f[d.k]=!f[d.k]; render(); },
  btab(d){ S.ui.btab=d.t; render(); },
  mjump(d){ const el=document.getElementById(d.id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); },
  stScope(d){ S.ui.stScope=d.s; render(); },
  openDay(d){ S.ui.openDay=S.ui.openDay===d.g?null:d.g; render(); },
  copyUrl(d){ const u=d.u; try{ navigator.clipboard.writeText(u).then(()=>toast("コピーしました"),()=>toast("長押しでコピーしてね")); }catch(e){ toast("長押しでコピーしてね"); } },
  claimOpen(){ S.ui.claimOpen=true; render(); },
  claimCancel(){ S.ui.claimOpen=false; render(); },
  tab(d){ S.ui.m=d.m; S.ui.sel=[]; render(); },
  pick(d){ const m=S.ui.m, n=MK[m].n, s=S.ui.sel, i=s.indexOf(d.id);
    if(i>=0) s.splice(i,1); else if(n===1) S.ui.sel=[d.id]; else if(s.length<n) s.push(d.id); render(); },
  amt(d){ if(S.ui.amtRaw!=null) normalizeAmt(); S.ui.amt=Math.max(unit(),(S.ui.amt||unit())+(+d.d)); render(); },
  bet(){
    const r=curRace(), me=myMember(); if(!r||!me||!isLive(r)) return;
    if(S.ui.amtRaw!=null) normalizeAmt(document.getElementById("amtInput"));
    const m=S.ui.m, sel=S.ui.sel.slice(), amt=S.ui.amt;
    if(amt%unit()){ toast(`${unit()}枚単位で賭けてね`); return; }
    if(sel.length!==MK[m].n) return;
    const bal=balances()[me]||0; if(bal<amt){ toast("チップが足りません"); return; }
    const cap=settings().caps[m]||0; const used=raceTickets(r).filter(t=>t.member===me&&t.m===m).reduce((a,t)=>a+t.amt,0);
    if(cap && used+amt>cap){ toast(`${MK[m].label}は1レース${cap}枚までです`); return; }
    mutateBets(S.uid, b=>{ b.member=me; (b.tickets=b.tickets||[]).push({id:rid(), race:r.id, member:me, m, sel, amt, t:now()}); });
    S.ui.sel=[]; play("coin"); toast(`${MK[m].label} ${amt}枚 賭けました！`);
  },
  betSelf(){
    const r=curRace(), me=myMember(); if(!r||!me||!isLive(r)||!r.runners.includes(me)) return;
    if(S.ui.amtRaw!=null) normalizeAmt(document.getElementById("amtInput"));
    const cap=settings().caps.self||0, amt=S.ui.amt;
    if(amt%unit()){ toast(`${unit()}枚単位で賭けてね`); return; }
    const used=raceTickets(r).filter(t=>t.member===me&&t.m==="win").reduce((a,t)=>a+t.amt,0);
    if(!cap||used+amt>cap){ toast(`自分への単勝は1レース${cap}枚までです`); return; }
    if((balances()[me]||0)<amt){ toast("チップが足りません"); return; }
    mutateBets(S.uid, b=>{ b.member=me; (b.tickets=b.tickets||[]).push({id:rid(), race:r.id, member:me, m:"win", sel:[me], amt, t:now()}); });
    play("coin"); toast(`自分の単勝 ${amt}枚！ 勝つしかない`);
  },
  cancelT(d){ const r=curRace(); if(!r||!isLive(r)) return; mutateBets(S.uid, b=>{ b.tickets=(b.tickets||[]).filter(t=>t.id!==d.id); }); toast("取り消しました"); },
  /* admin */
  addMember(){ const name=(S.ui.form.newName||"").trim(); if(!name) return; if(members().some(m=>m.name===name)){ toast("同じ名前がいます"); return; }
    const p=roster().find(x=>x.name===name), id=p?p.id:"p"+rid();
    S.ui.form.newName="";
    if(!p) mutateRoster(r=>{ r.players.push({id, name}); });
    let re=false; mutateState(s=>{ s.members.push({id, name, tb:Math.random()}); re=rescheduleRest(s); }).then(()=>{ if(re) toast(`${name}が途中参加。残りの出走表を組み直しました`); });
    toast(p?`${name}（登録済み）を追加`:`${name}を追加して名簿に保存しました`); },
  renameStart(d){ S.ui.editName=d.id; S.ui.form["rename_"+d.id]=mname(d.id); render(); const el=document.getElementById("rename_"+d.id); if(el){ el.focus(); el.select(); } },
  renameCancel(){ if(S.ui.editName) delete S.ui.form["rename_"+S.ui.editName]; S.ui.editName=null; render(); },
  renameSave(d){ const id=d.id, name=(S.ui.form["rename_"+id]||"").trim(); if(!name){ toast("名前を入れてね"); return; }
    if(name===mname(id)){ A.renameCancel(); return; }
    if(members().some(m=>m.id!==id&&m.name===name)||roster().some(p=>p.id!==id&&p.name===name)){ toast("同じ名前がいます"); return; }
    delete S.ui.form["rename_"+id]; S.ui.editName=null;
    mutateState(s=>{ const m=s.members.find(x=>x.id===id); if(m) m.name=name; });
    if(roster().some(p=>p.id===id)) mutateRoster(r=>{ const p=r.players.find(x=>x.id===id); if(p) p.name=name; });
    toast(`名前を「${name}」に変えました`); },
  addRoster(d){ const p=roster().find(x=>x.id===d.id); if(!p||members().some(m=>m.id===p.id)) return; let re=false; mutateState(s=>{ s.members.push({id:p.id, name:p.name, tb:Math.random()}); re=rescheduleRest(s); }).then(()=>{ if(re) toast(`${p.name}が途中参加。残りの出走表を組み直しました`); }); },
  addAllRoster(){ const add=roster().filter(p=>!members().some(m=>m.id===p.id)); if(!add.length) return; mutateState(s=>{ add.forEach(p=>s.members.push({id:p.id, name:p.name, tb:Math.random()})); rescheduleRest(s); }); toast(`${add.length}人を追加しました`); },
  delRoster(d){ if(S.ui.confirm!=="del:"+d.id){ S.ui.confirm="del:"+d.id; render(); return; } S.ui.confirm=null; mutateRoster(r=>{ r.players=r.players.filter(p=>p.id!==d.id); }); toast("名簿から消しました（成績は残ります）"); },
  mark(d){ const r=curRace(), me=myMember(); if(!r||!me||!isLive(r)) return;
    mutateBets(S.uid, b=>{ b.member=me; b.marks=b.marks||{}; const mk=b.marks[r.id]=b.marks[r.id]||{};
      if(mk[d.k]===d.id) delete mk[d.k]; else { for(const k in mk) if(mk[k]===d.id) delete mk[k]; mk[d.k]=d.id; } }); },
  ceremony(){ mutateState(s=>{ s.ceremony = s.ceremony ? null : now(); }); },
  pin(){ if(window.MK_WEB && window.MK_WEB.checkPin(S.ui.form.adminPin||"")){ S.isOwner=true; S.ui.form.adminPin=""; render(); } else toast("暗証番号が違います"); },
  toggleJoin(){ S.ui.showJoin=!S.ui.showJoin; render(); },
  leave(d){
    const r=curRace();
    if(r && isLive(r) && r.runners.includes(d.id)){ toast(`${mname(d.id)}は今のレースに出走中。レースが終わってから離脱してね`); return; }
    if(active().length-1<5) toast("参加者が4人以下になると賭ける人がいなくなります");
    let re=false; mutateState(s=>{ const m=s.members.find(x=>x.id===d.id); if(m) m.left=true; re=rescheduleRest(s); }).then(()=>toast(`${mname(d.id)}が離脱${re?"。残りの出走表を組み直しました":""}`));
  },
  toggleRace(d){
    const m0=mem(d.id); if(!m0) return; const off=!m0.noRace, r=curRace();
    if(off && r && r.status!=="done" && r.runners.includes(d.id)){ toast(`${m0.name}は今のレースに出走中。このレースが終わってから出走×にしてね`); return; }
    if(off && racers().filter(x=>x.id!==d.id).length<4){ toast("走れる人が4人未満になるので出走×にできません"); return; }
    let re=false; mutateState(s=>{ const m=s.members.find(x=>x.id===d.id); if(m) m.noRace=off; re=s.races.length?rescheduleRest(s):false; })
      .then(()=>toast(`${m0.name}を${off?"出走×（レースに入れない）":"出走できる"}にしました${re?"。残りの出走表を組み直しました":""}`));
  },
  rejoin(d){ let re=false; mutateState(s=>{ const m=s.members.find(x=>x.id===d.id); if(m) m.left=false; re=rescheduleRest(s); }).then(()=>toast(`${mname(d.id)}が復帰${re?"。残りの出走表を組み直しました":""}`)); },
  delMember(d){ mutateState(s=>{ s.members=s.members.filter(m=>m.id!==d.id); }); },
  send(d){ const n=Math.abs(parseInt(S.ui.form["send_"+d.id],10)||0); if(!n){ toast("枚数を入れてね"); return; }
    const v=d.sign==="-1"?-n:n, bal=balances()[d.id]||0;
    if(v<0 && n>bal){ toast(`${mname(d.id)}の残高は${bal}枚です`); return; }
    S.ui.form["send_"+d.id]="";
    mutateLedger(l=>{ (l.entries=l.entries||[]).push({id:rid(), gameId:S.state.gameId, member:d.id, amt:v, t:now()}); });
    toast(v>0?`${mname(d.id)}に${n}枚配りました`:`${mname(d.id)}から${n}枚減らしました`); },
  rc(d){ S.ui.raceCount=+d.r; render(); },
  fin(d){ const k=d.k; mutateState(s=>{ s.finals=Object.assign({g1:true,dobe:true}, s.finals||{}); s.finals[k]=!s.finals[k]; }); },
  makeSchedule(){
    const ids=members().filter(m=>!m.noRace).map(m=>m.id), R=S.ui.raceCount; if(!R) return;
    if(ids.length<4){ toast("走れる人が4人未満です（出走×を外してください）"); return; }
    const sch=makeSchedule(ids, scheduleTargets(ids,R).tgt); if(!sch){ toast("組み合わせを作れませんでした"); return; }
    const nr=!!S.state.newRound;
    mutateState(s=>{ const tr=(s.round||1)+(s.newRound?1:0), keep=(s.races||[]).filter(r=>(r.round||1)!==tr), base=keep.length;
      s.races=keep.concat(sch.map((runners,i)=>({id:"r"+rid(), no:base+i+1, round:tr, type:"prelim", runners, status:i===0?"open":"wait", closeAt:null, settle:null})));
      s.cur=base; s.round=tr; s.newRound=false; });
    toast(nr?"次の大会の出走表を作りました！受付開始":"出走表を作りました！第1レース受付開始");
  },
  countdown(){ const sec=settings().countdown; mutateState(s=>{ const r=s.races[s.cur]; r.status="countdown"; r.closeAt=now()+sec*1000; }); },
  plus30(){ mutateState(s=>{ const r=s.races[s.cur]; if(r.closeAt){ r.closeAt+=30000; r.ext=(r.ext||0)+1; } }); },
  closeNow(){ S.ui.order=[]; mutateState(s=>{ const r=s.races[s.cur]; if(r.status==="countdown"&&r.closeAt&&now()<r.closeAt-5000) r.early=1; r.status="closed"; r.closeAt=Math.min(r.closeAt||Infinity, now()); }); },
  reopen(){ mutateState(s=>{ const r=s.races[s.cur]; r.status="open"; r.closeAt=null; }); },
  orderPick(d){ const o=S.ui.order, i=o.indexOf(d.id); if(i>=0) o.splice(i,1); else o.push(d.id); render(); },
  orderReset(){ S.ui.order=[]; render(); },
  confirmResult(){
    const r=curRace(); if(!r) return; let o=S.ui.order.filter(id=>r.runners.includes(id));
    if(o.length===r.runners.length-1) o.push(r.runners.find(id=>!o.includes(id)));
    if(o.length!==r.runners.length) return;
    const rr=clone(r); rr.order=o; const settle=settleRace(rr);
    S.ui.order=[];
    const pl={}; raceTickets(rr).forEach(t=>pl[t.member]=(pl[t.member]||0)-t.amt);
    for(const [m,a] of Object.entries(settle.payouts)) pl[m]=(pl[m]||0)+a;
    for(const [m,a] of Object.entries(settle.prizes)) pl[m]=(pl[m]||0)+a;
    const gid=S.state.gameId, rid0=r.id, typ=r.type, pools={}; rr.settle=settle;
    const htix=raceTickets(rr).map(t=>({member:t.member, m:t.m, sel:t.sel, amt:t.amt, pay:ticketPay(rr,t)}));
    marketsFor(rr).forEach(m=>pools[m]=0); raceTickets(rr).forEach(t=>{ if(pools[t.m]!=null) pools[t.m]+=t.amt; });
    mutateState(s=>{ const x=s.races[s.cur]; x.order=o; x.settle=settle; x.status="done"; if(!x.closeAt) x.closeAt=now(); });
    mutateHistory(hh=>{ hh.races=hh.races.filter(x=>x.rid!==rid0); hh.races.push({rid:rid0, gid, t:now(), type:typ, no:r.no, runners:r.runners, order:o, pl, pools, ext:r.ext||0, early:r.early?1:0, tix:htix, prizes:settle.prizes}); });
  },
  undoResult(){ const r=curRace(); const rid0=r&&r.id; mutateState(s=>{ const x=s.races[s.cur]; x.settle=null; x.order=null; x.status="closed"; }); if(rid0) mutateHistory(hh=>{ hh.races=hh.races.filter(x=>x.rid!==rid0); }); },
  nextRace(){ mutateState(s=>{ s.cur++; const r=s.races[s.cur]; r.status="open"; r.closeAt=null; }); },
  makeFinals(){
    const st=standings(); if(st.length<4) return;
    const top=st.slice(0,4).map(x=>x.id), bottom=st.slice(-4).map(x=>x.id);
    const F=finalsOn(); if(!F.g1&&!F.dobe) return;
    mutateState(s=>{ const first=s.races.length;
      if(F.dobe) s.races.push({id:"r"+rid(), no:s.races.length+1, round:s.round||1, type:"dobe", runners:bottom, status:"wait", closeAt:null, settle:null});
      if(F.g1) s.races.push({id:"r"+rid(), no:s.races.length+1, round:s.round||1, type:"g1", runners:top, status:"wait", closeAt:null, settle:null});
      s.cur=first; s.races[first].status="open"; });
    toast(F.dobe?"決勝を組みました！まずはD決定戦":"決勝を組みました！G1グランプリ");
  },
  ptab(d){ S.ui.pm=d.m; S.ui.psel=[]; render(); },
  ppick(d){ const m=S.ui.pm, n=MK[m].n, s=S.ui.psel, i=s.indexOf(d.id); if(i>=0) s.splice(i,1); else if(n===1) S.ui.psel=[d.id]; else if(s.length<n) s.push(d.id); render(); },
  pbet(){
    const r=curRace(), pm=S.ui.proxyMember, m=S.ui.pm, sel=S.ui.psel.slice(), amt=parseInt(S.ui.pamt,10)||0;
    if(amt%unit()){ toast(`${unit()}枚単位で入力してね`); return; }
    if(!r||!isLive(r)||!pm||sel.length!==MK[m].n||amt<1) return;
    if((balances()[pm]||0)<amt){ toast("チップが足りません"); return; }
    const cap=settings().caps[m]||0, used=raceTickets(r).filter(t=>t.member===pm&&t.m===m).reduce((a,t)=>a+t.amt,0);
    if(cap&&used+amt>cap){ toast(`${MK[m].label}は1レース${cap}枚までです`); return; }
    mutateBets("proxy", b=>{ (b.tickets=b.tickets||[]).push({id:rid(), race:r.id, member:pm, m, sel, amt, t:now()}); });
    S.ui.psel=[]; toast(`${mname(pm)}：${MK[m].label} ${amt}枚`);
  },
  saveSettings(){
    const f=S.ui.form, st=clone(settings()), num=(id,d)=>{ const x=parseFloat(f[id]); return isFinite(x)?x:d; };
    delete st.learned;
    MORDER.forEach(m=>st.rates[m]=Math.min(100,Math.max(0,num("rate_"+m,st.rates[m]))));
    st.prizes.prelim=[num("pz_prelim_0",st.prizes.prelim[0]),num("pz_prelim_1",st.prizes.prelim[1])];
    st.prizes.g1=[num("pz_g1_0",st.prizes.g1[0]),num("pz_g1_1",st.prizes.g1[1])];
    st.prizes.dobe=[num("pz_dobe_0",st.prizes.dobe[0])];
    Object.keys(f).filter(k=>/^(rate_|pz_)/.test(k)).forEach(k=>delete f[k]);
    mutateState(s=>{ s.settings=st; }); toast("設定を保存しました");
  },
  newRound(){ mutateState(s=>{ s.newRound=true; }); toast("右の「出走表」でレース数を選んでください"); },
  askEnd(d){ S.ui.confirm="end:"+d.s; render(); },
  async endGame(d){ S.ui.confirm=null; if(d.s==="save"){ await exportCSV("tickets"); await exportCSV("races"); }
    mutateState(s=>{ s.ended=now(); s.ceremony=s.ended; s.newRound=false; }); },
  endClose(){ S.ui.confirm=null; const keep=settings(); delete keep.learned; mutateState(s=>{ Object.assign(s, defaultState()); s.settings=keep; s.ended=null; s.ceremony=null; s.round=1; s.newRound=false; }); toast("最初の画面に戻りました"); },
  cerPhoneClose(){ S.ui.cerClosed=S.state.ended; S.lastOverlayKey=""; render(); },
  askReset(){ S.ui.confirm="reset"; render(); },
  cancelConfirm(){ S.ui.confirm=null; render(); },
  reset(){ S.ui.confirm=null; const keep=settings(); mutateState(s=>{ Object.assign(s, defaultState()); s.settings=keep; }); toast("リセットしました"); },
  csvT(){ exportCSV("tickets"); },
  csvR(){ exportCSV("races"); },
};
async function exportCSV(kind){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  let rows=[];
  if(kind==="tickets"){
    rows.push(["race_no","race_type","bettor","market","selection","amount","placed_at","valid","hit","odds","payout","entry"]);
    races().forEach(r=>{
      allTickets().filter(t=>t.race===r.id).forEach(t=>{
        const ok=validFor(r,t), h=r.settle&&r.settle.hits.find(x=>x.member===t.member&&x.m===t.m&&keyOf(x.m,x.sel)===keyOf(t.m,t.sel));
        rows.push([r.no,r.type,mname(t.member),MK[t.m].label,selText(r,t.m,t.sel),t.amt,new Date(t.t).toISOString(),ok?1:0,h?1:0,h?h.v:"",h?payRound(t.amt*h.v):"",t.doc==="proxy"?"proxy":"phone"]);
      });
    });
  } else {
    rows.push(["race_no","race_type","runners","order","sales","win_pool","ex_pool","qu_pool","tri_pool","t3_pool","payout_total","prize_total","house","win_odds","ex_odds","qu_odds","tri_odds","t3_odds"]);
    races().forEach(r=>{ const s=r.settle; if(!s) return; const pt=s.poolTotals||{};
      rows.push([r.no,r.type,r.runners.map(mname).join("/"),s.order.map(mname).join(">"),s.sales,pt.win||0,pt.ex||0,pt.qu||0,pt.tri||0,pt.t3||"",Object.values(s.payouts).reduce((a,b)=>a+b,0),Object.values(s.prizes).reduce((a,b)=>a+b,0),s.house,...["win","ex","qu","tri","t3"].map(m=>s.winOdds[m]?(s.winOdds[m].v??"none"):"")]); });
  }
  const csv="﻿"+rows.map(r=>r.map(q).join(",")).join("\n");
  const dl=await claude.use("downloads");
  if(!dl){ toast("このビューでは保存できません"); return; }
  try{ await dl.save({filename:`marika-keiba-${kind}.csv`, data:csv}); }catch(e){ if(e&&e.code!=="declined") toast("保存できませんでした"); }
}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el||el.disabled) return;
  const f=A[el.dataset.act]; if(f){ e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener("input",e=>{
  const b=e.target.dataset&&e.target.dataset.bind; if(!b) return;
  if(b==="amt"){ S.ui.amtRaw=e.target.value; S.ui.amt=parseInt(e.target.value,10)||0; return; }
  if(b==="proxyMember") S.ui.proxyMember=e.target.value;
  else if(b==="pamt") S.ui.pamt=e.target.value;
  else S.ui.form[b]=e.target.value;
  if(b==="proxyMember") render();
});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.bind==="proxyMember"){ S.ui.proxyMember=e.target.value; render(); }
  if(e.target.id==="amtInput"){ normalizeAmt(e.target); setTimeout(()=>{ if(document.activeElement!==e.target) render(); },400); }
});
/* 手入力した枚数を、賭けの単位（100枚）に合わせる */
function normalizeAmt(el){
  const U=unit(), raw=parseInt(S.ui.amtRaw!=null?S.ui.amtRaw:(el?el.value:S.ui.amt),10)||0;
  const v=Math.max(U,Math.floor(raw/U)*U); S.ui.amtRaw=null; S.ui.amt=v; if(el) el.value=v;
  if(raw!==v) toast(`${U}枚単位にして ${v}枚にしました`);
  return v;
}
document.addEventListener("keydown",e=>{ if(e.isComposing||e.keyCode===229) return; if(e.key==="Enter"&&e.target.id==="adminPin") A.pin(); if(e.target.id&&e.target.id.startsWith("rename_")){ if(e.key==="Enter") A.renameSave({id:e.target.id.slice(7)}); else if(e.key==="Escape") A.renameCancel(); } });
window.addEventListener("hashchange",()=>{ S.lastOverlayKey=""; render(); });
// 裏に回っていたタブが表に出たら、最新の状態で描き直す（大画面の結果がすぐ出るように）
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ S.lastOverlayKey=""; render(); } });

/* ticker: countdown digits, auto-close on admin, overlay countdown */
let lastStatusKey="";
setInterval(()=>{
  const r=curRace(); if(!r) return;
  document.querySelectorAll("[data-cd]").forEach(el=>{ const s=remain(r); if(s!==null){ el.textContent=mmss(s); el.classList.toggle("hot",s<=10); } });
  if((mode()==="admin"||mode()==="adminhelp") && S.isOwner && r.status==="countdown" && now()>=r.closeAt && !S.closing){
    S.closing=true; S.ui.order=[]; mutateState(s=>{ const x=s.races[s.cur]; if(x.status==="countdown") x.status="closed"; }).finally(()=>S.closing=false);
  }
  sfxWatch();
  const key=r.id+r.status+(isLive(r)?"L":"C")+(r.status==="countdown"&&remain(r)<=5?remain(r):"");
  if(key!==lastStatusKey){ lastStatusKey=key; render(); }
  else if(mode()==="board") renderOverlay();
},250);

/* ---------------- boot ---------------- */
render();
(async()=>{
  const [db,user]=await Promise.all([claude.use("db"), claude.use("user")]);
  if(!db){ S.noDb=true; render(); return; }
  S.db=db; S.user=user;
  if(user){ S.uid=await user.id(); S.isOwner=await user.isOwner(); }
  let got=0; const mark=()=>{ if(++got>=5){ S.ready=true; } render(); };
  const once=fn=>{ let first=true; return x=>{ fn(x); if(first){ first=false; mark(); } else render(); }; };
  db.doc("game/state").onSnapshot(once(s=>{ S.state = s.exists ? s.data() : defaultState(); }), e=>console.error(e));
  db.doc("game/ledger").onSnapshot(once(s=>{ S.ledger = s.exists ? s.data() : {entries:[]}; }), e=>console.error(e));
  db.doc("game/roster").onSnapshot(once(s=>{ S.roster = s.exists ? s.data() : {players:[]}; }), e=>console.error(e));
  db.doc("game/history").onSnapshot(once(s=>{ S.history = s.exists ? s.data() : {races:[]}; }), e=>console.error(e));
  db.collection("bets").onSnapshot(once(q=>{ const b={}; q.docs.forEach(d=>b[d.id]=d.data()); S.bets=b; }), e=>console.error(e));
})();
</script>
